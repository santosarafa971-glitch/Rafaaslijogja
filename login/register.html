<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrapper">
    <form id="registerForm">
      <h2>Sign In</h2>
        <div class="input-field">
        <input type="text" id="username"required placeholder="Username">
        <label for="username">Enter username</label>
      </div>
      <div class="input-field">
        <input type="text" id="email"required placeholder="Email">
        <label for="username">Enter email</label>
      </div>
      <div class="input-field">
        <input type="text" id="password"required placeholder="Password">
        <label for="username">Enter password</label>
      </div>
      <p id="message"></p>
      <div class="forget">
        <label for="remember">
          <input type="checkbox" id="remember">
          <p>Remember me</p>
        </label>
      </div>
      <button type="submit">Sign in</button>
      <div class="social">
        <div class="go"><a href="index.html">Login</a></div>
      </div>
    </form>
  </div>
  <script src="js/register.js" defer></cript>
</body>
</html>
